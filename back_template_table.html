<html>
    <head>
        <style>
            @page {
                size: A4; /* Change from the default size of A4 */
                margin: 0mm; /* Set margin on each page */
            }
            body {
                font-family: Arial, sans-serif;
                margin: 0;
                padding: 0;
                background-color: white;
                font-size: 10pt;
                width: 210mm;
                height: 297mm;
                display: flex;
                align-items: center; /* Vertically center */
                justify-content: center; /* Horizontally center */
            }
            .card {
                position: relative; /* Enable positioning for child elements */
                background-color: white;
                width: 65mm;
                height: 65mm;
                overflow: hidden; /* Prevent overflow */
            }
            table {
                width: 195mm;
                table-layout: fixed;
                margin-left: auto; 
                margin-right: auto;
                margin-top: auto;
                margin-bottom: auto;
            }
            td {
                width: 65mm;
                height: 65mm;
            }
            .qr-code {
                position: absolute; /* Position QR code absolutely within card */
                top: 50%; /* Center vertically */
                left: 50%; /* Center horizontally */
                transform: translate(-50%, -50%); /* Adjust for its own size */
                width: 40%; /* Adjust width as needed */
                height: auto; /* Maintain aspect ratio */
                height: auto; /* Maintain aspect ratio */
                z-index: 2; /* Above the snowflake */
                opacity: 1; /* Fully visible */
            }
            .snowflake {
                width: 100%;
                height: 100%;
                z-index: 1; /* Below the QR code */
                position: absolute; /* Position snowflake absolutely within card */
            }

        </style>
    </head>
